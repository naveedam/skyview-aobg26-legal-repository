<style>
/* ==========================================================================
   Skyview AOBG26 Legal Repository - Material-inspired Production Styles
   Primary: #0F766E | Secondary: #2563EB | Background: #F8FAFC
   ========================================================================== */

:root {
  --primary: #0F766E;
  --primary-hover: #0D655E;
  --primary-light: #CCFBF1;
  --primary-dark: #115E59;
  --secondary: #2563EB;
  --secondary-hover: #1D4ED8;
  --secondary-light: #DBEAFE;
  --bg-page: #F8FAFC;
  --surface: #FFFFFF;
  --surface-alt: #F1F5F9;
  --text-main: #0F172A;
  --text-muted: #475569;
  --text-light: #94A3B8;
  --border: #E2E8F0;
  --border-focus: #0F766E;
  --danger: #DC2626;
  --danger-light: #FEE2E2;
  --success: #16A34A;
  --success-light: #DCFCE7;
  --warning: #D97706;
  --warning-light: #FEF3C7;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg-page);
  color: var(--text-main);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}

/* App Header */
.app-header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #FFFFFF;
  padding: 24px 20px;
  box-shadow: var(--shadow-md);
  position: sticky;
  top: 0;
  z-index: 50;
}

.header-container {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.header-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.header-title-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-badge {
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 4px 10px;
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.app-title {
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.app-subtitle {
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.9);
  max-width: 780px;
}

.header-nav {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-link-btn {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #FFFFFF;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.nav-link-btn:hover {
  background: rgba(255, 255, 255, 0.28);
  color: #FFFFFF;
}

/* Main Container */
.main-content {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 16px;
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  padding: 24px;
  margin-bottom: 24px;
  transition: box-shadow 0.2s ease;
}

.card:hover {
  box-shadow: var(--shadow-md);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.card-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title-number {
  background: var(--primary-light);
  color: var(--primary-dark);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 700;
}

/* Form Controls */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-main);
}

.form-label-required::after {
  content: " *";
  color: var(--danger);
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 10px 14px;
  font-size: 0.95rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background-color: #FFFFFF;
  color: var(--text-main);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
}

.form-textarea {
  min-height: 80px;
  resize: vertical;
}

.form-hint {
  font-size: 0.78rem;
  color: var(--text-muted);
}

/* Checkbox Grid (Legal Status) */
.checkbox-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.checkbox-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background-color: #FFFFFF;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.checkbox-card:hover {
  border-color: var(--primary);
  background-color: var(--surface-alt);
}

.checkbox-card input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
  cursor: pointer;
}

.checkbox-label {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text-main);
}

/* Repeating Unit Card */
.unit-card {
  background: #FFFFFF;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  margin-bottom: 20px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.unit-card-header {
  background: var(--surface-alt);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 10px;
}

.unit-header-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.unit-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-main);
}

.unit-badge {
  background: var(--primary);
  color: #FFFFFF;
  padding: 4px 12px;
  border-radius: 9999px;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
}

.unit-card-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.unit-spec-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

@media (max-width: 768px) {
  .unit-spec-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Document Upload Area inside Unit Card */
.doc-section-wrapper {
  background: #FAFCFE;
  border: 1px dashed #CBD5E1;
  border-radius: var(--radius-sm);
  padding: 18px;
}

.doc-section-header {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.file-dropzone {
  border: 2px dashed #94A3B8;
  border-radius: var(--radius-sm);
  padding: 20px;
  text-align: center;
  background: #FFFFFF;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-top: 10px;
}

.file-dropzone:hover, .file-dropzone.dragover {
  border-color: var(--primary);
  background: var(--primary-light);
}

.file-dropzone-icon {
  font-size: 32px;
  color: var(--primary);
  margin-bottom: 6px;
}

.file-dropzone-text {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-main);
}

.file-dropzone-sub {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 4px;
}

/* Uploaded Files Preview List */
.file-preview-list {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.file-preview-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
}

.file-preview-details {
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
}

.file-preview-name {
  font-weight: 600;
  color: var(--text-main);
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
}

.file-preview-stored {
  font-size: 0.75rem;
  color: var(--primary);
  font-family: monospace;
}

.file-preview-meta {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Buttons */
.btn {
  padding: 10px 20px;
  font-size: 0.92rem;
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
  text-decoration: none;
}

.btn-primary {
  background-color: var(--primary);
  color: #FFFFFF;
}

.btn-primary:hover {
  background-color: var(--primary-hover);
}

.btn-secondary {
  background-color: var(--secondary);
  color: #FFFFFF;
}

.btn-secondary:hover {
  background-color: var(--secondary-hover);
}

.btn-outline {
  background-color: transparent;
  border: 1.5px solid var(--border);
  color: var(--text-main);
}

.btn-outline:hover {
  background-color: var(--surface-alt);
  border-color: var(--text-muted);
}

.btn-danger-outline {
  background-color: transparent;
  border: 1px solid #FCA5A5;
  color: var(--danger);
  padding: 6px 12px;
  font-size: 0.82rem;
}

.btn-danger-outline:hover {
  background-color: var(--danger-light);
}

.btn-lg {
  padding: 14px 28px;
  font-size: 1.05rem;
  border-radius: var(--radius-md);
}

/* Stats Cards (Admin) */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stat-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stat-label {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-icon {
  font-size: 18px;
  padding: 6px;
  border-radius: var(--radius-sm);
  background: var(--surface-alt);
}

.stat-value {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--primary-dark);
  line-height: 1.1;
}

/* Table Controls & Search */
.table-toolbar {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 18px;
}

.search-input-wrapper {
  position: relative;
  width: 100%;
}

.search-input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  font-size: 0.95rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background-color: #FFFFFF;
}

.search-icon-inside {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 16px;
}

.filters-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}

/* Data Table */
.table-container {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: #FFFFFF;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.86rem;
  text-align: left;
}

.data-table th {
  background-color: var(--surface-alt);
  color: var(--text-main);
  padding: 12px 14px;
  font-weight: 700;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}

.data-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

.data-table tr:hover {
  background-color: #F8FAFC;
}

.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  white-space: nowrap;
}

.badge-primary {
  background-color: var(--primary-light);
  color: var(--primary-dark);
}

.badge-secondary {
  background-color: var(--secondary-light);
  color: var(--secondary);
}

/* Setup Splash Screen */
.setup-box {
  text-align: center;
  max-width: 680px;
  margin: 40px auto;
  padding: 40px 30px;
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
}

.setup-icon {
  font-size: 48px;
  color: var(--primary);
  margin-bottom: 16px;
}

.setup-title {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--text-main);
  margin-bottom: 10px;
}

.setup-desc {
  font-size: 0.95rem;
  color: var(--text-muted);
  margin-bottom: 26px;
  line-height: 1.6;
}

.setup-tree-preview {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  text-align: left;
  font-family: monospace;
  font-size: 0.82rem;
  margin-bottom: 26px;
  line-height: 1.5;
  color: var(--text-main);
}

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}

.modal-content {
  background: #FFFFFF;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  max-width: 580px;
  width: 100%;
  padding: 28px;
  animation: modalIn 0.2s ease-out;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.modal-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--success-light);
  color: var(--success);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin: 0 auto 16px auto;
}

.modal-title {
  font-size: 1.35rem;
  font-weight: 800;
  text-align: center;
  color: var(--text-main);
  margin-bottom: 8px;
}

.modal-subtitle {
  font-size: 0.92rem;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 20px;
}

.receipt-box {
  background: var(--surface-alt);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 20px;
}

.receipt-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 0.88rem;
}

.receipt-row:last-child {
  border-bottom: none;
}

.receipt-label {
  color: var(--text-muted);
}

.receipt-value {
  font-weight: 700;
  color: var(--text-main);
}

/* Spinner */
.spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: #FFFFFF;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.hidden {
  display: none !important;
}
</style>
